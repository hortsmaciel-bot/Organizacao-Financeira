  /* ================= events ================= */
  function bindEvents(){
    document.querySelectorAll('[data-act="tab"]').forEach(function(b){
      b.onclick = function(){ state.tab = b.getAttribute('data-tab'); render(); };
    });
    var pm = document.querySelector('[data-act="prev-month"]');
    if (pm) pm.onclick = function(){ if (state.month > JOURNEY_START) { state.month = addMonths(state.month,-1); render(); } };
    var nm = document.querySelector('[data-act="next-month"]');
    if (nm) nm.onclick = function(){ state.month = addMonths(state.month,1); render(); };
    var gt = document.querySelector('[data-act="goto-today"]');
    if (gt) gt.onclick = function(){ state.month = REAL_MONTH; render(); };

    var cfgBtn = document.getElementById('btn-config');
    if (cfgBtn) cfgBtn.onclick = function(){ openSheet(sheetConfig()); };

    var budgetBtn = document.querySelector('[data-act="edit-budget-value"]');
    if (budgetBtn) budgetBtn.onclick = function(){ openSheet(sheetBudgetForm(state.month)); bindBudgetForm(state.month); };

    document.querySelectorAll('[data-act="toggle-fixed"]').forEach(function(b){
      b.onclick = function(e){ e.stopPropagation(); toggleFixedPaid(b.getAttribute('data-id'), state.month, b.getAttribute('data-paid')==='1'); };
    });
    document.querySelectorAll('[data-act="toggle-card"]').forEach(function(b){
      b.onclick = function(e){ e.stopPropagation(); toggleCardPaid(b.getAttribute('data-id'), state.month, b.getAttribute('data-paid')==='1'); };
    });
    document.querySelectorAll('[data-act="toggle-debt"]').forEach(function(b){
      b.onclick = function(e){ e.stopPropagation(); toggleDebtPaid(b.getAttribute('data-id'), state.month, b.getAttribute('data-paid')==='1'); };
    });
    document.querySelectorAll('[data-act="edit-fixed-value"]').forEach(function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var f = state.fixedCosts.find(function(x){ return x.id===b.getAttribute('data-id'); });
        openSheet(sheetValueForm("fixed", f, state.month));
        bindValueForm();
      };
    });
    document.querySelectorAll('[data-act="edit-actual-value"]').forEach(function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var f = state.fixedCosts.find(function(x){ return x.id===b.getAttribute('data-id'); });
        openSheet(sheetActualForm(f, state.month));
        bindActualForm(f, state.month);
      };
    });
    document.querySelectorAll('[data-act="edit-debt-value"]').forEach(function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var d = state.debts.find(function(x){ return x.id===b.getAttribute('data-id'); });
        openSheet(sheetValueForm("debt", d, state.month));
        bindValueForm();
      };
    });
    document.querySelectorAll('[data-act="edit-purchase-value"]').forEach(function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var p = state.purchases.find(function(x){ return x.id===b.getAttribute('data-id'); });
        openSheet(sheetValueForm("purchase", p, state.month));
        bindValueForm();
      };
    });
    document.querySelectorAll('[data-act="toggle-card-acc"]').forEach(function(b){
      b.onclick = function(){ var id=b.getAttribute('data-id'); state.cardOpen[id]=!state.cardOpen[id]; render(); };
    });
    document.querySelectorAll('[data-act="toggle-inactive-fixed"]').forEach(function(b){
      b.onclick = function(){ state.showInactiveFixed = !state.showInactiveFixed; render(); };
    });
    document.querySelectorAll('[data-act="select-card"]').forEach(function(b){
      b.onclick = function(){ state.selectedCardId = b.getAttribute('data-id'); render(); };
    });

    document.querySelectorAll('[data-act="edit-fixed"]').forEach(function(b){
      b.onclick = function(){
        var f = state.fixedCosts.find(function(x){ return x.id===b.getAttribute('data-id'); });
        openSheet(sheetFixedForm(f));
        bindFixedForm(f);
      };
    });
    var newFixed = document.querySelector('[data-act="new-fixed"]');
    if (newFixed) newFixed.onclick = function(){ openSheet(sheetFixedForm(null)); bindFixedForm(null); };

    var newCard = document.querySelector('[data-act="new-card"]');
    if (newCard) newCard.onclick = function(){ openSheet(sheetCardForm()); bindCardForm(); };

    document.querySelectorAll('[data-act="new-purchase"]').forEach(function(b){
      b.onclick = function(){ openSheet(sheetPurchaseForm(b.getAttribute('data-card'))); bindPurchaseForm(); };
    });
    document.querySelectorAll('[data-act="del-purchase-choice"]').forEach(function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var p = state.purchases.find(function(x){ return x.id===b.getAttribute('data-id'); });
        if (p) { openSheet(sheetDeletePurchase(p, state.month)); bindDeletePurchaseSheet(p, state.month); }
      };
    });

    var newDebt = document.querySelector('[data-act="new-debt"]');
    if (newDebt) newDebt.onclick = function(){ openSheet(sheetDebtForm(null)); bindDebtForm(null); };
    document.querySelectorAll('[data-act="edit-debt"]').forEach(function(b){
      b.onclick = function(){
        var d = state.debts.find(function(x){ return x.id===b.getAttribute('data-id'); });
        openSheet(sheetDebtForm(d));
        bindDebtForm(d);
      };
    });
  }

  function bindFixedForm(existing){
    document.getElementById('form-fixed').onsubmit = function(e){
      e.preventDefault();
      var isReserve = document.getElementById('ff-reserve').checked;
      var data = {
        name: document.getElementById('ff-name').value.trim(),
        value: parseMoney(document.getElementById('ff-value').value),
        dueDay: parseInt(document.getElementById('ff-day').value,10) || null,
        kind: isReserve ? "reserve" : "normal",
        startMonth: readMonthPicker('ff-start') || null,
        endMonth: readMonthPicker('ff-end') || null
      };
      if (!data.name) return;
      if (data.startMonth && data.endMonth && data.startMonth > data.endMonth){ showToast("O mês final precisa ser depois do inicial."); return; }
      var p;
      if (existing) p = docRef("fixedCosts", existing.id).update(data);
      else p = col("fixedCosts").add(Object.assign({active:true, statusByMonth:{}, actualByMonth:{}}, data));
      p.then(function(){ closeSheet(); showToast("Salvo."); }).catch(function(){ showToast("Erro ao salvar."); });
    };
    var delBtn = document.querySelector('[data-act="del-fixed"]');
    if (delBtn) delBtn.onclick = function(){
      openSheet(sheetDeleteFixed(existing, state.month));
      bindDeleteFixedSheet(existing, state.month);
    };
  }

  function sheetDeleteFixed(f, ym){
    var startsLater = f.startMonth && f.startMonth >= ym;
    return sheetHead("Remover custo fixo") +
      '<p style="font-size:13px;color:var(--ink-muted);margin:-4px 0 16px;">'+escapeHtml(f.name)+'</p>' +
      (startsLater ? '<p style="font-size:12.5px;color:var(--ink-faint);margin:0 0 12px;">Este custo só começa em '+monthLabel(f.startMonth)+', então nenhum mês anterior é afetado.</p>' :
        '<button type="button" class="add-btn" data-act="do-end-fixed" style="margin-bottom:10px;">Remover a partir de '+monthLabel(ym)+' <span style="display:block;font-size:11px;color:var(--ink-faint);font-weight:400;margin-top:2px;">vale até '+monthLabel(addMonths(ym,-1))+'; os meses anteriores continuam com este custo e a mesma soma</span></button>') +
      '<button type="button" class="add-btn" data-act="do-del-fixed-all" style="color:var(--bad);border-color:var(--bad);">Excluir de todos os meses <span style="display:block;font-size:11px;color:var(--bad);opacity:.8;font-weight:400;margin-top:2px;">some também dos meses passados e muda as somas deles</span></button>';
  }

  function bindDeleteFixedSheet(f, ym){
    var endBtn = document.querySelector('[data-act="do-end-fixed"]');
    if (endBtn) endBtn.onclick = function(){
      var newEnd = addMonths(ym, -1);
      if (f.endMonth && f.endMonth < newEnd) newEnd = f.endMonth;
      docRef("fixedCosts", f.id).update({endMonth:newEnd})
        .then(function(){ closeSheet(); showToast("Removido a partir de "+monthLabel(ym)+"."); })
        .catch(function(){ showToast("Erro ao salvar."); });
    };
    var allBtn = document.querySelector('[data-act="do-del-fixed-all"]');
    if (allBtn) allBtn.onclick = function(){
      openConfirm("Excluir \""+f.name+"\" de todos os meses (passados e futuros)? Essa ação não pode ser desfeita.", function(){
        docRef("fixedCosts", f.id).delete()
          .then(function(){ showToast("Custo fixo excluído de todos os meses."); })
          .catch(function(){ showToast("Erro ao excluir."); });
      });
    };
  }

  function bindCardForm(){
    document.getElementById('form-card').onsubmit = function(e){
      e.preventDefault();
      var name = document.getElementById('fc-name').value.trim();
      if (!name) return;
      var color = CARD_COLORS[state.cards.length % CARD_COLORS.length];
      col("cards").add({name:name, color:color, statusByMonth:{}})
        .then(function(){ closeSheet(); showToast("Cartão adicionado."); })
        .catch(function(){ showToast("Erro ao salvar."); });
    };
  }

  function bindPurchaseForm(){
    var type = "parcelado";
    document.querySelectorAll('#form-purchase .seg-toggle button').forEach(function(b){
      b.onclick = function(){
        document.querySelectorAll('#form-purchase .seg-toggle button').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        type = b.getAttribute('data-type');
        document.getElementById('fp-parcel-fields').style.display = (type==="avista") ? "none" : "block";
      };
    });
    document.getElementById('form-purchase').onsubmit = function(e){
      e.preventDefault();
      var cardId = document.getElementById('fp-card').value;
      var name = document.getElementById('fp-name').value.trim();
      var value = parseMoney(document.getElementById('fp-value').value);
      var refMonth = document.getElementById('fp-month').value || state.month;
      if (!name || !value) return;
      var current = 1, total = 1;
      if (type==="parcelado"){
        current = parseInt(document.getElementById('fp-current').value,10) || 1;
        total = parseInt(document.getElementById('fp-total').value,10) || 1;
        if (current>total) current = total;
      }
      var startMonth = addMonths(refMonth, -(current-1));
      col("purchases").add({cardId:cardId, name:name, value:value, installmentTotal:total, startMonth:startMonth})
        .then(function(){ closeSheet(); showToast("Compra adicionada."); })
        .catch(function(){ showToast("Erro ao salvar."); });
    };
  }

  function bindDebtForm(existing){
    document.getElementById('form-debt').onsubmit = function(e){
      e.preventDefault();
      var name = document.getElementById('fd-name').value.trim();
      var value = parseMoney(document.getElementById('fd-value').value);
      var current = parseInt(document.getElementById('fd-current').value,10) || 1;
      var total = parseInt(document.getElementById('fd-total').value,10) || 1;
      var refMonth = document.getElementById('fd-month').value || state.month;
      if (current>total) current = total;
      var startMonth = addMonths(refMonth, -(current-1));
      var data = {
        name:name,
        category: document.getElementById('fd-cat').value.trim(),
        installmentValue: value,
        installmentTotal: total,
        startMonth: startMonth,
        notes: document.getElementById('fd-notes').value.trim(),
        active:true
      };
      if (!name || !value) return;
      var p;
      if (existing) p = docRef("debts", existing.id).update(data);
      else p = col("debts").add(Object.assign({statusByMonth:{}}, data));
      p.then(function(){ closeSheet(); showToast("Salvo."); }).catch(function(){ showToast("Erro ao salvar."); });
    };
    var delBtn = document.querySelector('[data-act="del-debt"]');
    if (delBtn) delBtn.onclick = function(){
      var did = delBtn.getAttribute('data-id');
      openConfirm("Excluir esta dívida? Essa ação não pode ser desfeita.", function(){
        docRef("debts", did).delete().then(function(){ showToast("Dívida excluída."); }).catch(function(){ showToast("Erro ao excluir."); });
      });
    };
  }

  function bindDeletePurchaseSheet(p, ym){
    var monthBtn = document.querySelector('[data-act="do-del-month"]');
    if (monthBtn) monthBtn.onclick = function(){
      var patch = {excludedMonths:{}}; patch.excludedMonths[ym] = true;
      docRef("purchases", p.id).update(patch)
        .then(function(){ closeSheet(); showToast("Removido de "+monthLabel(ym)+"."); })
        .catch(function(){ showToast("Erro ao excluir."); });
    };
    var allBtn = document.querySelector('[data-act="do-del-all"]');
    if (allBtn) allBtn.onclick = function(){
      openConfirm("Excluir \""+p.name+"\" de todos os meses (passados e futuros)? Essa ação não pode ser desfeita.", function(){
        docRef("purchases", p.id).delete()
          .then(function(){ showToast("Compra excluída de todos os meses."); })
          .catch(function(){ showToast("Erro ao excluir."); });
      });
    };
  }

  function bindActualForm(doc, ym){
    var form = document.getElementById('form-actual');
    if (!form) return;
    form.onsubmit = function(e){
      e.preventDefault();
      var val = parseMoney(document.getElementById('fa-value').value);
      var patch = {actualByMonth:{}}; patch.actualByMonth[ym] = val;
      docRef("fixedCosts", doc.id).update(patch)
        .then(function(){ closeSheet(); showToast("Gasto real de "+monthLabel(ym)+" salvo."); })
        .catch(function(){ showToast("Erro ao salvar."); });
    };
  }

  function bindValueForm(){
    var form = document.getElementById('form-value');
    if (!form) return;
    form.onsubmit = function(e){
      e.preventDefault();
      var kind = document.getElementById('fv-kind').value;
      var id = document.getElementById('fv-id').value;
      var val = parseMoney(document.getElementById('fv-value').value);
      var coll = kind==="fixed" ? "fixedCosts" : (kind==="purchase" ? "purchases" : "debts");
      var patch = {valueByMonth:{}}; patch.valueByMonth[state.month] = val;
      docRef(coll, id).update(patch)
        .then(function(){ closeSheet(); showToast("Valor de "+monthLabel(state.month)+" salvo."); })
        .catch(function(){ showToast("Erro ao salvar."); });
    };
    var resetBtn = document.querySelector('[data-act="reset-value"]');
    if (resetBtn) resetBtn.onclick = function(){
      var kind = resetBtn.getAttribute('data-kind');
      var id = resetBtn.getAttribute('data-id');
      var coll = kind==="fixed" ? "fixedCosts" : (kind==="purchase" ? "purchases" : "debts");
      var patch = {valueByMonth:{}}; patch.valueByMonth[state.month] = null;
      docRef(coll, id).update(patch)
        .then(function(){ closeSheet(); showToast("Valor padrão restaurado neste mês."); })
        .catch(function(){ showToast("Erro ao salvar."); });
    };
  }

  function bindBudgetForm(ym){
    var form = document.getElementById('form-budget');
    if (form) form.onsubmit = function(e){
      e.preventDefault();
      var val = parseMoney(document.getElementById('fb-value').value);
      var patch = {budgetByMonth:{}}; patch.budgetByMonth[ym] = val;
      docRef("config","main").update(patch).then(function(){
        state.config.budgetByMonth = Object.assign({}, state.config.budgetByMonth, patch.budgetByMonth);
        _budgetCache = null;
        openSheet(sheetBudgetForm(ym));
        bindBudgetForm(ym);
        showToast("Salário de "+monthLabel(ym)+" salvo.");
      }).catch(function(){ showToast("Erro ao salvar."); });
    };
    var resetBtn = document.querySelector('[data-act="reset-budget"]');
    if (resetBtn) resetBtn.onclick = function(){
      var patch = {budgetByMonth:{}}; patch.budgetByMonth[ym] = null;
      docRef("config","main").update(patch).then(function(){
        state.config.budgetByMonth = Object.assign({}, state.config.budgetByMonth, patch.budgetByMonth);
        _budgetCache = null;
        openSheet(sheetBudgetForm(ym));
        bindBudgetForm(ym);
        showToast("Padrão restaurado neste mês.");
      }).catch(function(){ showToast("Erro ao salvar."); });
    };
    var paidCb = document.getElementById('fb-paid');
    if (paidCb) paidCb.onchange = function(){
      var v = paidCb.checked;
      var patch = {salaryPaidByMonth:{}}; patch.salaryPaidByMonth[ym] = v;
      docRef("config","main").update(patch).then(function(){
        state.config.salaryPaidByMonth = Object.assign({}, state.config.salaryPaidByMonth, patch.salaryPaidByMonth);
        showToast(v ? "Salário marcado como recebido." : "Salário marcado como a receber.");
      }).catch(function(){ paidCb.checked = !v; showToast("Erro ao salvar."); });
    };
    document.querySelectorAll('[data-act="extra-received"]').forEach(function(cb){
      cb.onchange = function(){
        var id = cb.getAttribute('data-id'), v = cb.checked;
        docRef("extraIncomes", id).update({received:v}).then(function(){
          var it = state.extraIncomes.find(function(x){ return x.id===id; });
          if (it) it.received = v;
          showToast(v ? "Marcado como recebido." : "Marcado como a receber.");
        }).catch(function(){ cb.checked = !v; showToast("Erro ao salvar."); });
      };
    });
    var extraForm = document.getElementById('form-extra-income');
    if (extraForm) extraForm.onsubmit = function(e){
      e.preventDefault();
      var name = document.getElementById('fei-name').value.trim();
      var value = parseMoney(document.getElementById('fei-value').value);
      if (!name || !value) return;
      col("extraIncomes").add({month:ym, name:name, value:value}).then(function(doc){
        state.extraIncomes.push({id:doc.id, month:ym, name:name, value:value}); // optimistic, snapshot reconciles
        _budgetCache = null;
        openSheet(sheetBudgetForm(ym));
        bindBudgetForm(ym);
        showToast("Renda extra adicionada.");
      }).catch(function(){ showToast("Erro ao salvar."); });
    };
    document.querySelectorAll('[data-act="del-extra-income"]').forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute('data-id');
        docRef("extraIncomes", id).delete().then(function(){
          state.extraIncomes = state.extraIncomes.filter(function(x){ return x.id!==id; });
          _budgetCache = null;
          openSheet(sheetBudgetForm(ym));
          bindBudgetForm(ym);
        }).catch(function(){ showToast("Erro ao excluir."); });
      };
    });
  }

  /* overlay bindings (static) */
  document.addEventListener('click', function(e){
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-act')==='close-sheet'){ closeSheet(); }
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-act')==='logout'){
      if (supa) supa.auth.signOut().then(function(){ location.reload(); });
    }
    if (e.target && e.target.id==='overlay'){ closeSheet(); }
    if (e.target && e.target.id==='form-config'){ /* handled by submit */ }
  });
  document.addEventListener('submit', function(e){
    if (e.target && e.target.id==='form-config'){
      e.preventDefault();
      var v = parseMoney(document.getElementById('cf-budget').value);
      docRef("config","main").set(Object.assign({}, state.config, {budgetTotal:v}))
        .then(function(){ closeSheet(); showToast("Orçamento atualizado."); })
        .catch(function(){ showToast("Erro ao salvar."); });
    }
  });

  /* ================= login + boot ================= */
  var CFG = window.PAINEL_CONFIG || {};
  var started = false, recovering = false;

  function authShell(inner){
    document.getElementById("app").innerHTML =
      '<div style="min-height:86vh;display:flex;flex-direction:column;justify-content:center;gap:20px;">' +
        '<div style="text-align:center;">' +
          '<div class="brand" style="justify-content:center;"><div class="mark">✨</div><h1>Painel Bolso</h1></div>' +
          '<div style="font-size:12.5px;color:var(--ink-muted);margin-top:6px;">seu cantinho financeiro 💖</div>' +
        '</div>' +
        '<div class="card-list" style="padding:18px;">' + inner + '</div>' +
      '</div>';
  }
  function authError(msg){ var el = document.getElementById("auth-msg"); if (el) el.textContent = msg || ""; }
  function friendly(err){
    var m = (err && err.message) || "";
    if (/invalid login/i.test(m)) return "E-mail ou senha incorretos.";
    if (/email not confirmed/i.test(m)) return "Confirme seu e-mail antes de entrar.";
    if (/at least|weak|short/i.test(m)) return "Escolha uma senha mais longa (mínimo 8 caracteres).";
    if (/rate|too many/i.test(m)) return "Muitas tentativas. Aguarde um pouquinho.";
    return "Não deu certo: " + m;
  }

  function showLogin(){
    authShell(
      '<form id="form-login">' +
        '<div class="field"><label>E-mail</label><input id="lg-email" type="email" autocomplete="username" required></div>' +
        '<div class="field"><label>Senha</label><input id="lg-pass" type="password" autocomplete="current-password" required></div>' +
        '<div id="auth-msg" style="font-size:12.5px;color:var(--bad);min-height:18px;margin-bottom:8px;"></div>' +
        '<button type="submit" class="btn btn-primary">Entrar</button>' +
        '<button type="button" id="lg-forgot" class="btn-danger-text" style="display:block;margin:10px auto 0;color:var(--ink-muted);">Esqueci minha senha</button>' +
      '</form>');
    document.getElementById("form-login").onsubmit = function(e){
      e.preventDefault();
      authError("Entrando…");
      supa.auth.signInWithPassword({
        email: document.getElementById("lg-email").value.trim(),
        password: document.getElementById("lg-pass").value
      }).then(function(r){
        if (r.error) return authError(friendly(r.error));
        startApp(r.data.session);
      });
    };
    document.getElementById("lg-forgot").onclick = function(){
      var email = document.getElementById("lg-email").value.trim();
      if (!email) return authError("Digite seu e-mail acima primeiro.");
      supa.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname}).then(function(r){
        var el = document.getElementById("auth-msg");
        if (r.error){ authError(friendly(r.error)); }
        else { el.style.color = "var(--good)"; el.textContent = "Enviamos um link para redefinir a senha no seu e-mail."; }
      });
    };
  }

  function showNewPassword(){
    authShell(
      '<form id="form-newpass">' +
        '<div style="font-weight:700;margin-bottom:10px;">Crie uma nova senha</div>' +
        '<div class="field"><label>Nova senha (mínimo 8 caracteres)</label><input id="np-pass" type="password" autocomplete="new-password" minlength="8" required></div>' +
        '<div id="auth-msg" style="font-size:12.5px;color:var(--bad);min-height:18px;margin-bottom:8px;"></div>' +
        '<button type="submit" class="btn btn-primary">Salvar nova senha</button>' +
      '</form>');
    document.getElementById("form-newpass").onsubmit = function(e){
      e.preventDefault();
      supa.auth.updateUser({password: document.getElementById("np-pass").value}).then(function(r){
        if (r.error) return authError(friendly(r.error));
        recovering = false;
        history.replaceState(null, "", location.pathname);
        supa.auth.getSession().then(function(x){ if (x.data.session) startApp(x.data.session); else showLogin(); });
      });
    };
  }

  function startApp(session){
    if (started) return;
    started = true;
    render();
    initDb(session.user.id);
  }

  function boot(){
    overlay = document.getElementById('overlay');
    sheetEl = document.getElementById('sheet');
    if (!window.supabase || !CFG.url || !CFG.anonKey || /COLE_/.test(CFG.url + CFG.anonKey)){
      authShell('<p style="margin:0;font-size:13.5px;line-height:1.5;">Falta configurar o arquivo <b>config.js</b> com a URL e a chave do seu projeto Supabase. Veja o passo a passo no README.</p>');
      return;
    }
    supa = window.supabase.createClient(CFG.url, CFG.anonKey);
    if (location.hash.indexOf("type=recovery") > -1) recovering = true;
    supa.auth.onAuthStateChange(function(ev){
      if (ev === "PASSWORD_RECOVERY"){ recovering = true; showNewPassword(); }
      else if (ev === "SIGNED_OUT" && started){ location.reload(); }
    });
    supa.auth.getSession().then(function(r){
      if (recovering){ showNewPassword(); return; }
      if (r.data && r.data.session) startApp(r.data.session);
      else showLogin();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
